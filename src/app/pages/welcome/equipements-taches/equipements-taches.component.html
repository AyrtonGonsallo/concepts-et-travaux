<div>
    
    <h2>Équipements tâches</h2> 

    <div class="box-filters">
      <fieldset>
        <legend>Tâches</legend>
            
          <div class="section-produit">
      
            <button nz-button nzType="primary" class="w-fit  positive-action mb-5 mt-5" [routerLink]="['/administration', 'equipements-taches', 'ajouter-equipements-tache']">Ajouter une tâche</button>
            
             <div class="section-import">
              <div class="input-link">
                <input type="file" (change)="onFileSelected($event)" />
                
              </div>
              
              <button nz-button nzType="primary" class=" w-fit positive-action mb-5 mt-5" (click)="importer()">Importer des tâches</button>
            </div> 
            
            <button nz-button nzType="primary" class="w-fit positive-action mb-5 mt-5" (click)="exporter()">Exporter les tâches</button>
            <a href="https://homeren.fr/gammes_import.xlsx" target="_blank" class="dl-btn-link mb-5 mt-5">Télécharger le modèle</a>
          </div> 
          
      </fieldset>
    </div>

    <div class="box-filters">
      <fieldset>
        <legend>Filtres</legend>
            
        <div class="filter-container">
          <div class="filter-box">
            Travail
            <nz-select [(ngModel)]="filteredTravailID" (ngModelChange)="doubleSearch(true,true)"  class="filter-select2">
              <nz-option  nzLabel="Tous les travaux" [nzValue]="0"></nz-option>
              <nz-option *ngFor="let option of travaux" [nzLabel]="option.Titre" [nzValue]="option.ID"></nz-option>
            </nz-select>
          </div>
          <div class="filter-box">
            Étape
            <nz-select [(ngModel)]="filteredEtape2" (ngModelChange)="doubleSearch(false,true)" class="filter-select2">
              <nz-option  nzLabel="Toutes les étapes" nzValue=""></nz-option>
                <nz-option *ngFor="let element of filteredListEtapes"  [nzValue]="element" [nzLabel]="element"></nz-option>
            </nz-select>
          </div>
          <div class="filter-box">
            Sous-catégorie
            <nz-select [(ngModel)]="filteredSouscategorie" (ngModelChange)="search22()" nzPlaceHolder="Toutes les sous-catégories" class="filter-select2">
             <nz-option nzLabel="Toutes les sous-catégories" nzValue=""></nz-option>
              <nz-option *ngFor="let sc of filteredListSousCategories" [nzLabel]="sc.label"  [nzValue]="sc.value"></nz-option>
            </nz-select>
          </div>

                    <label nz-checkbox [(ngModel)]="cacher_elements_fournisseurs_artisans" (ngModelChange)="search22()">Masquer les élements des artisans/fournisseurs</label> 


        </div>
       
      


      </fieldset>
    </div>


    <nz-table #sortTable2 [nzData]="listOfDisplayData22" [nzPageSize]="50" nzTableLayout="fixed" [nzScroll]="{ x: '1240px' }">
        <thead>
          <tr>
            <th [nzWidth]="column.width" *ngFor="let column of listOfColumn22" nzCustomFilter [nzSortOrder]="column.order" [nzSortFn]="column.compare" [nzSortPriority]="column.priority">
              {{ column.title }}
              <nz-filter-trigger *ngIf="column.title=='Titre'" [(nzVisible)]="visible" [nzActive]="searchValue.length > 0" >
                <span nz-icon nzType="search"></span>
              </nz-filter-trigger>
            </th>
            <th nzWidth="50px">
              Actions
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of sortTable2.data" >
            <td>{{ data.Label }}</td>
            <td>{{ data.Type }}</td>
            <td>{{ data.Etape }}</td>
            <td>{{ get_travail_title(data.TravailID) }}</td>
            <td>{{ data.Prix }} €</td>
             <td nzEllipsis (click)="editOrdre(data)">
              <ng-container *ngIf="editingOrdreId !== data.ID; else editOrdreTemplate">
                {{ data.Ordre }}
              </ng-container>

              <ng-template #editOrdreTemplate>
                <input
                  nz-input
                  type="number"
                  [(ngModel)]="data.Ordre"
                  (click)="$event.stopPropagation()"
                  (keydown.enter)="saveOrdre(data)"
                  (blur)="saveOrdre(data)"
                />
              </ng-template>
            </td>
        
            
          
           
            
            <td> 
              <button nz-button nzType="primary" class="positive-action mb-5 mr-5"  [nzSize]="size" title="modifier" [routerLink]="['/administration', 'equipements-taches', 'modifier-equipements-tache',data.ID]"><span nz-icon nzType="edit"></span></button>
              <button nz-button nzType="primary" class="negative-action mb-5" [nzSize]="size" title="supprimer"  nz-popconfirm
              nzPopconfirmTitle="Voulez-vous vraiment supprimer cette tache ?"
              nzPopconfirmPlacement="bottom"
              (nzOnConfirm)="deleteGamme(data.ID)"
               ><span nz-icon nzType="delete"></span></button>
            </td>
          </tr>
        </tbody>
    </nz-table>
    
</div>
