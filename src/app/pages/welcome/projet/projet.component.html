<div>
    <h2>Liste des projets</h2>
    <!--
        <button nz-button nzType="primary" class="positive-action mb-5 me-5 mt-5" [routerLink]="['/administration', 'projets', 'ajouter-projet']">Ajouter un projet</button>
    -->
    <button nz-button nzType="primary" class="positive-action mb-5 ms-5 mt-5" (click)=_swith_display_edit_relation()>Déplacer un devis</button>

    <div nz-row *ngIf="_display_edit_relation">
        <div nz-col nzSpan="12" >

            <form nz-form [formGroup]="projet_devis_Form" (ngSubmit)="_editProjetDevis()">
                <nz-form-item >
                    <nz-form-label [nzSm]="6" [nzXs]="24"  nzFor="projet_id" nzRequired >
                        <span>Projet</span>
                    </nz-form-label>
                    <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="remplissez ce champ">
                        <nz-input-number id="projet_id" formControlName="projet_id"  ></nz-input-number> 
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item >
                    <nz-form-label [nzSm]="6" [nzXs]="24"  nzFor="devis_id" nzRequired >
                        <span>Devis</span>
                    </nz-form-label>
                    <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="remplissez ce champ">
                        <nz-input-number id="devis_id" formControlName="devis_id"  ></nz-input-number> 
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                    <nz-form-label [nzSm]="6" [nzXs]="24"  nzFor="action"  nzRequired  >
                        <span>action</span>
                    </nz-form-label>
                    <nz-form-control [nzSm]="14" [nzXs]="24" >
                        <nz-select id="action" formControlName="action">
                            <nz-option  nzLabel="Créer" nzValue="add"></nz-option>
                            <!--
                            <nz-option  nzLabel="Supprimer" nzValue="delete"></nz-option>
                            -->
                            
                        </nz-select>
                    </nz-form-control>
                
                </nz-form-item>

            
                <nz-form-item nz-row class="register-area">
                    <nz-form-control [nzSpan]="14" [nzOffset]="6">
                        <button nz-button nzType="primary">Envoyer</button>
                    </nz-form-control>
                </nz-form-item>
            </form>
        </div>
    </div>



    <nz-table  #sortTable  [nzData]="projets" nzTableLayout="fixed" [nzScroll]="{ x: '240px' }">
        <thead>
        <tr>
            <th *ngFor="let column of listOfColumn" [nzSortOrder]="column.order" [nzSortFn]="column.compare" [nzSortPriority]="column.priority">
            {{ column.title }}
            </th>
            <th>
                Devis - Prix TTC
              </th>
            <th>
                Actions
              </th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let data of sortTable.data">
            <td>{{ data.Id }}</td>
            <td>{{ data.Date_de_creation | date: 'dd/MM/yyyy' }}</td>

            <td>{{ data.Nom }}</td>
            <td>{{ data.Status }} <span *ngIf="data.Status=='travaux en cours'">({{ data.ProgressionTravaux }}%)</span></td>
            
            <td><div *ngFor="let devisPiece of data?.Devis"><span>devis #{{devisPiece.ID}} - {{calculerPrixTTC(devisPiece.Prix,devisPiece.Tva.Valeur)}} €</span><br></div></td>
            <td> 
                <button nz-button nzType="primary" class="positive-action mb-5" [nzSize]="size" title="modifier" [routerLink]="['/administration', 'projets', 'modifier-projet',data.Id]"><span nz-icon nzType="edit"></span></button>
                <button *ngIf="data.Status=='visite à régler'" nz-button nzType="primary" class="negative-action mb-5" [nzSize]="size" title="supprimer" (click)="deleteProjet(data.Id)"><span nz-icon nzType="delete"></span></button>
              </td>
        </tr>
        </tbody>
    </nz-table>
</div>
