<div class="width-800">
    <h1 class="ttl-recap">Rénovation électrique partielle</h1>
        
        <form *ngIf="formulaire" [formGroup]="formulaire" (ngSubmit)="submit()" >
            
        
               
                <div formArrayName="appareils">
                  <div *ngFor="let appCtrl of appareils.controls; let i = index" [formGroupName]="i">
                    <h4>{{ appCtrl.value.titre }}</h4>
                    <div class="rempl_creer">
                        <div>
                            <label>À créer</label>
                            <input type="number" formControlName="nombre_a_creer" />
                        </div>
                        <div>
                            <label>À remplacer</label>
                            <input type="number" formControlName="nombre_a_remplacer" />
                        </div>
                    </div>
                  </div>
                </div>
             
              
  
                <div class="flx-radio-row2">
                    <div class="" >
                        <label>Gamme d'appareillage :</label>
                    </div>
                    <nz-radio-group formControlName="gamme" class="">
                        <!-- Reusable template for displaying options with PDFs -->
                        <div nz-col class="flx-radio-row1">
                            <div *ngFor="let option of gammes_appareillage" class="parquet-option  tooltip-srf  flex-see-gamme">
                            <label class="radio-span" nz-radio [nzValue]="option.ID + '-' + option.PrixMultiples + '-' + option.Label"  class="with-link">
                                <span>
                                <!-- Dynamically display the label based on the type -->
                                {{ option.Label }}
                                </span>
                            </label>
                            
                            </div>
                        </div>
                    </nz-radio-group>
                </div>
                
  
                
        

    <div class="mur-btn-div tooltip-srf">
        <span  class="mur-ttl">
            Prix coûtant
        </span>
    </div>
    

    <nz-radio-group formControlName="artisan_gamme">
      <!-- Plinthes bois -->
      <div class="flx-radio-row2">
        <label>Artisan :</label>
        <div>
          <div *ngFor="let option of artisans_gammes">
            <label nz-radio [nzValue]="option.ID + '-' + option.PrixMultiples + '-' + option.Label">
              {{ option.Label }} - {{ option.Artisan?.Nom }} {{ option.Artisan?.Prenom }} ({{ option.Artisan?.CategorieArtisan }}) - {{option.Prix}} €
            <span nz-tooltip [nzTooltipTitle]="getprixMultiples(option.PrixMultiples)"><span class="memory" nz-icon nzType="question-circle" nzTheme="outline"></span></span>

            </label>
            
          </div>
        </div>
      </div>
    </nz-radio-group>

    <nz-radio-group formControlName="fournisseur_gamme">
      <!-- Plinthes bois -->
      <div class="flx-radio-row2">
        <label>Fournisseur  :</label>
        <div>
          <div *ngFor="let option of fournisseurs_gammes">
            <label nz-radio [nzValue]="option.ID + '-' + option.PrixMultiples + '-' + option.Label">
              {{ option.Label }} - {{ option.Fournisseur?.Nom }} {{ option.Fournisseur?.Prenom }} ({{ option.Fournisseur?.CategorieFournisseur }}) - {{option.Prix}} € 
              <span nz-tooltip [nzTooltipTitle]="getprixMultiples(option.PrixMultiples)"><span class="memory" nz-icon nzType="question-circle" nzTheme="outline"></span></span>
            </label>
            
          </div>
        </div>
      </div>
    </nz-radio-group>




        
          
  <div class="grid-btn-action">
    <button nz-button nzType="primary" class="positive-action mb-5" type="submit">Tester</button>
    <button *ngIf="edit_mode" nz-button nzType="primary" class="positive-action mb-5" (click)="modifier()">Modifier</button>

</div>
  
  <ng-container *ngIf="detailsCalcul">
        <div>
        <div class="mur-btn-div tooltip-srf">
          <span  class="mur-ttl">
              Prix facturé
          </span>
      </div>
        <span>Prix: {{ detailsCalcul.resultats[element.TravailSlug]?.prix }} €</span><br>
        <span>Formule: </span><br>
        <span [innerHTML]="detailsCalcul.resultats[element.TravailSlug]?.formule"></span>

        
        <div class="mur-btn-div tooltip-srf">
          <span  class="mur-ttl">
              Prix coûtant
          </span>
      </div>
        <span>Prix: {{ detailsCalcul.resultats[element.TravailSlug]?.prix_marge }} €</span><br>
        <span>Formule: </span><br>
        <span [innerHTML]="detailsCalcul.resultats[element.TravailSlug]?.formule_marge"></span>
      </div>
    </ng-container>
  
</form>


</div>
