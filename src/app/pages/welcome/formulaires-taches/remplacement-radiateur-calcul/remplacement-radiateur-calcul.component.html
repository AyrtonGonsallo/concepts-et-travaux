<div class="width-800">
    <h1 class="ttl-recap">Remplacement de radiateur
    </h1>
        
        <form *ngIf="formulaire" [formGroup]="formulaire" (ngSubmit)="submit()" >
            
            <div>
                <div class="flx-radio-row2 ">
                  <label for="surface">Surface de la pièce (m²)</label>
                  <input  type="number" id="surface" formControlName="surface"  min="1">
                </div>
                <div class="flx-radio-row2 ">
                  <label for="hauteur">Hauteur de la pièce (cm)<span class="error-message">*</span> :</label>
                  <input  type="number" id="hauteur" formControlName="hauteur" max="700" min="1">
                </div>
            </div>
            <div formArrayName="type_radiateurs_form">
                <div *ngFor="let radiateur of type_radiateurs_form.controls; let j = index" [formGroupName]="j">
                    <div class="flx-radio-row2 ">
                        <div class="">
                            <label class="">Type radiateur {{j+1}}:</label>
                        </div>
                        <nz-radio-group formControlName="type" class="">
                            <div class="flx-radio-row2">
                                <div *ngFor="let option of types">
                                    <label nz-radio [nzValue]="option.ID + ':' + option.Prix + ':' + option.Label">
                                    <span>{{ option.Label }}</span> 
                                    </label>
                                </div>
                            </div>
                        </nz-radio-group>
                    </div>

                    
                        <span  class="mur-ttl">
                            Prix coûtant
                        </span>
                    
                    

                    <nz-radio-group formControlName="artisan_type">
                        <!-- Plinthes bois -->
                        <div class="flx-radio-row2">
                        <label>Artisan type :</label>
                        <div>
                            <div *ngFor="let option of artisans_type[j]">
                            <label nz-radio [nzValue]="option.ID + ':' + option.Prix + ':' + option.Label">
                                {{ option.Label }} - {{ option.Artisan?.Nom }} {{ option.Artisan?.Prenom }} ({{ option.Artisan?.CategorieArtisan }}) - {{option.Prix}} €
                            </label>
                            </div>
                        </div>
                        </div>
                    </nz-radio-group>

                    <nz-radio-group formControlName="fournisseur_type">
                        <!-- Plinthes bois -->
                        <div class="flx-radio-row2">
                        <label>Fournisseur type :</label>
                        <div>
                            <div *ngFor="let option of fournisseurs_type[j]">
                            <label nz-radio [nzValue]="option.ID + ':' + option.Prix + ':' + option.Label">
                                {{ option.Label }} - {{ option.Fournisseur?.Nom }} {{ option.Fournisseur?.Prenom }} ({{ option.Fournisseur?.CategorieFournisseur }}) - {{option.Prix}} €
                            </label>
                            </div>
                        </div>
                        </div>
                    </nz-radio-group>
                </div>
            </div>
            <div formArrayName="gamme_radiateurs_form">
                <div *ngFor="let radiateur of gamme_radiateurs_form.controls; let i = index" [formGroupName]="i">
                    <div class="flx-radio-row2 ">
                        <div class="">
                            <label class="">Gamme radiateur {{i+1}}:</label>
                        </div>
                        <nz-radio-group formControlName="gamme" class="rd-grp-w">
                            <div class="flx-radio-row2-w">
                                <div *ngFor="let option of gammes_radiateurs" class="parquet-option nt-col tooltip-srf flex-see-gamme" >
                                    <label nz-radio [nzValue]="option.ID + ':' + option.Prix + ':' + option.Titre"   class="with-link">
                                        <span>
                                            {{ option.Titre }}
                                        </span>
                                    </label>
                                </div>
                            </div>
                        </nz-radio-group>
                    </div>

                    <div nz-row>
                        <div nz-col nzSpan="20">

                            <span  class="mur-ttl">
                                Prix coûtant
                            </span>
                        
                        

                            <nz-radio-group formControlName="artisan_pose">
                                <!-- Plinthes bois -->
                                <div class="flx-radio-row2">
                                <label>Artisan pose :</label>
                                <div>
                                    <div *ngFor="let option of artisans_pose[i]">
                                    <label nz-radio [nzValue]="option.ID + ':' + option.Prix + ':' + option.Titre">
                                        {{ option.Titre }} - {{ option.Artisan?.Nom }} {{ option.Artisan?.Prenom }} ({{ option.Artisan?.CategorieArtisan }}) - {{option.Prix}} €
                                    </label>
                                    </div>
                                </div>
                                </div>
                            </nz-radio-group>

                            <nz-radio-group formControlName="fournisseur_pose">
                                <!-- Plinthes bois -->
                                <div class="flx-radio-row2">
                                <label>Fournisseur pose :</label>
                                <div>
                                    <div *ngFor="let option of fournisseurs_pose[i]">
                                    <label nz-radio [nzValue]="option.ID + ':' + option.Prix + ':' + option.Titre">
                                        {{ option.Titre }} - {{ option.Fournisseur?.Nom }} {{ option.Fournisseur?.Prenom }} ({{ option.Fournisseur?.CategorieFournisseur }}) - {{option.Prix}} €
                                    </label>
                                    </div>
                                </div>
                                </div>
                            </nz-radio-group>
                        </div>
                        
                    </div>
                </div>
            </div>
            
          
            <div class="grid-btn-action">
                <button nz-button nzType="primary" class="positive-action mb-5" type="submit">Tester</button>
                <button *ngIf="edit_mode" nz-button nzType="primary" class="positive-action mb-5" (click)="modifier()">Modifier</button>

           </div>
              
               <ng-container *ngIf="detailsCalcul">
    <div>
      <div class="mur-btn-div tooltip-srf">
        <span  class="mur-ttl">
            Prix facturé
        </span>
    </div>
      <span>Prix: {{ detailsCalcul.resultats[element.TravailSlug]?.prix }} €</span><br>
      <span>Formule: </span><br>
      <span [innerHTML]="detailsCalcul.resultats[element.TravailSlug]?.formule"></span>

      <div class="mur-btn-div tooltip-srf">
        <span  class="mur-ttl">
            Prix coûtant
        </span>
    </div>
    <span>Prix: {{ detailsCalcul.resultats[element.TravailSlug]?.prix_marge }} €</span><br>
    <span>Formule: </span><br>
    <span [innerHTML]="detailsCalcul.resultats[element.TravailSlug]?.formule_marge"></span>
    </div>
  </ng-container>
               
         </form>
   
   
       </div>
