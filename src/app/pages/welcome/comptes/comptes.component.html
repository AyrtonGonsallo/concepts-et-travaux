<div>
    <h2>Gestion des comptes</h2>    


    <div class="filter-role">
      Rôle :
      <nz-select [(ngModel)]="filteredRoleID" (ngModelChange)="filterByRole()"  class="filter-select2">
        <nz-option  nzLabel="Tous les rôles" [nzValue]="0"></nz-option>
        <nz-option *ngFor="let option of roles" [nzLabel]="option.Titre" [nzValue]="option.Id"></nz-option>
      </nz-select>
      <div>
        <button nz-button nzType="primary" class="positive-action " [routerLink]="['/administration', 'comptes', 'ajouter-compte']">Ajouter un compte</button>
      </div>
    </div>
          


    <nz-table #sortTable [nzData]="filteredUtilisateurs"  nzTableLayout="fixed" [nzScroll]="{ x: '240px' }">
        <thead>
          <tr>
            <th *ngFor="let column of listOfColumn" [nzSortFn]="column.compare" [nzSortPriority]="column.priority">
              {{ column.title }}
            </th>
            <th>
              Actions
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of sortTable.data" >
            <td *ngIf="isHimOrSuperAdmin(data.Id)">{{ data.Id }}</td>
            <td *ngIf="isHimOrSuperAdmin(data.Id)">{{ data.RaisonSociale }}</td>
            <td *ngIf="isHimOrSuperAdmin(data.Id)">{{ data.Nom }}</td>
            <td *ngIf="isHimOrSuperAdmin(data.Id)">{{ data.Prenom }}</td>
            <td *ngIf="isHimOrSuperAdmin(data.Id)">{{ data.Email }}</td>
            <td *ngIf="isHimOrSuperAdmin(data.Id)">{{ data.Telephone }}</td>
            <td *ngIf="isHimOrSuperAdmin(data.Id)">{{ data.AdressePostale }}</td>
            <td *ngIf="isHimOrSuperAdmin(data.Id)">{{ data.Role?.Titre }}</td>
            <td *ngIf="isHimOrSuperAdmin(data.Id)"> 
              <button nz-button nzType="primary" class="positive-action mb-5" *ngIf="isHimOrSuperAdmin(data.Id)" [nzSize]="size" title="modifier" [routerLink]="['/administration', 'comptes', 'modifier-compte',data.Id]"><span nz-icon nzType="edit"></span></button>
              <button nz-button nzType="primary" class="negative-action mb-5" [nzSize]="size" title="supprimer"  nz-popconfirm
              nzPopconfirmTitle="Are you sure delete this account?"
              nzPopconfirmPlacement="bottom"
              (nzOnConfirm)="deleteUser(data.Id,data?.Role?.Id)"
              (nzOnCancel)="cancel()" ><span nz-icon nzType="delete"></span></button>
            </td>
          </tr>
        </tbody>
    </nz-table>
</div>
